name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend build & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Cache Gradle
        uses: actions/setup-gradle@v4
      - name: Build & test (Testcontainers uses the runner's Docker)
        working-directory: backend
        run: ./gradlew build --no-daemon

  # frontend and e2e jobs are added in phases 5 and 8
  frontend:
    name: Frontend (stub)
    runs-on: ubuntu-latest
    steps:
      - run: echo "Frontend job added in phase 5"

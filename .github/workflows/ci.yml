name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend build & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      # On Linux CI the default Docker socket works for Testcontainers; no
      # api.version workaround is needed (that is a Docker Desktop / Windows quirk).
      - name: Build & test (unit + Testcontainers integration + gRPC contract)
        working-directory: backend
        run: ./gradlew build --no-daemon

  schema:
    name: Protobuf + GraphQL schema generate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      # Regenerate the gRPC stubs from the committed proto; fails if it can't build.
      - name: Generate protobuf + build contracts
        working-directory: backend
        run: ./gradlew :contracts:build --no-daemon

  frontend:
    name: Frontend check, test & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci || npm install
      - run: npm run check
      - run: npm test
      # Build also proves no browser bundle imports server-only GraphQL ($lib/server).
      - run: npm run build

  importer:
    name: Importer tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: demo/importer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci || npm install
      - run: npm run typecheck
      - run: npm test

  compose-smoke:
    name: Compose smoke test
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build backend jars for Docker images
        working-directory: backend
        run: ./gradlew :catalogue-service:bootJar :people-service:bootJar --no-daemon
      - name: Build frontend artifacts for Docker image
        working-directory: frontend
        run: |
          npm ci || npm install
          npm run build
      # Bring the app up (no seed: no TMDB token in CI) and confirm health.
      - name: Bring up stack (empty, no seed)
        run: docker compose up -d --build --wait
      - name: Verify Catalogue readiness
        run: |
          curl -fsS http://localhost:8080/actuator/health/readiness | grep -q '"status":"UP"'
      # Proxy is the only published port and had no healthcheck before V2.6-08;
      # readiness above never touches it, so this is the only check that covers
      # the whole browser-facing chain (V2.7-05).
      - name: Verify proxy serves the frontend
        run: curl -fsS http://localhost:4173/ > /dev/null
      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      # The full create person -> create movie -> add credit -> upload artwork ->
      # search -> remove credit -> delete journey (V2.7-05): it creates every
      # record it needs, so it runs against the empty, unseeded stack above with
      # no TMDB_READ_TOKEN required.
      - name: Run E2E journey against the composed stack
        working-directory: frontend
        env:
          BASE_URL: http://localhost:4173
        run: npm run test:e2e
      - name: Tear down
        if: always()
        run: docker compose down -v

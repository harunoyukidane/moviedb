services:
  catalogue-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${CATALOGUE_DB_NAME:-catalogue}
      POSTGRES_USER: ${CATALOGUE_DB_USER:-catalogue}
      POSTGRES_PASSWORD: ${CATALOGUE_DB_PASSWORD:-catalogue}
    volumes:
      - catalogue-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CATALOGUE_DB_USER:-catalogue} -d ${CATALOGUE_DB_NAME:-catalogue}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [internal]

  people-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${PEOPLE_DB_NAME:-people}
      POSTGRES_USER: ${PEOPLE_DB_USER:-people}
      POSTGRES_PASSWORD: ${PEOPLE_DB_PASSWORD:-people}
    volumes:
      - people-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PEOPLE_DB_USER:-people} -d ${PEOPLE_DB_NAME:-people}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [internal]

  people-service:
    build:
      context: ./backend
      dockerfile: people-service/Dockerfile
    environment:
      PEOPLE_DB_URL: jdbc:postgresql://people-db:5432/${PEOPLE_DB_NAME:-people}
      PEOPLE_DB_USER: ${PEOPLE_DB_USER:-people}
      PEOPLE_DB_PASSWORD: ${PEOPLE_DB_PASSWORD:-people}
      PEOPLE_GRPC_PORT: "9090"
      PEOPLE_HTTP_PORT: "8081"
      PERSON_ARTWORK_STORAGE_PATH: /var/lib/artwork
    volumes:
      - person-artwork-data:/var/lib/artwork
    depends_on:
      people-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health/readiness | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    # gRPC (9090) and health (8081) stay on the internal network only.
    networks: [internal]

  catalogue-service:
    build:
      context: ./backend
      dockerfile: catalogue-service/Dockerfile
    environment:
      CATALOGUE_DB_URL: jdbc:postgresql://catalogue-db:5432/${CATALOGUE_DB_NAME:-catalogue}
      CATALOGUE_DB_USER: ${CATALOGUE_DB_USER:-catalogue}
      CATALOGUE_DB_PASSWORD: ${CATALOGUE_DB_PASSWORD:-catalogue}
      PEOPLE_GRPC_TARGET: static://people-service:9090
      CATALOGUE_HTTP_PORT: "8080"
      ARTWORK_STORAGE_PATH: /var/lib/artwork
    volumes:
      - catalogue-artwork-data:/var/lib/artwork
    depends_on:
      catalogue-db:
        condition: service_healthy
      people-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health/readiness | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    ports:
      # Only the reviewer-facing Catalogue HTTP port is published.
      - "${CATALOGUE_HTTP_PORT:-8080}:8080"
    networks: [internal]

  # SvelteKit server-side BFF (the browser's only entry point). Calls Catalogue
  # GraphQL + People HTTP server-side over the internal network; the browser never
  # touches the backends directly.
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      CATALOGUE_GRAPHQL_URL: http://catalogue-service:8080/graphql
      CATALOGUE_HTTP_URL: http://catalogue-service:8080
      PEOPLE_HTTP_URL: http://people-service:8081
      ORIGIN: http://localhost:${FRONTEND_PORT:-4173}
      PORT: "3000"
    depends_on:
      catalogue-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/movies || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    ports:
      - "${FRONTEND_PORT:-4173}:3000"
    networks: [internal]

  # One-shot TMDB importer (§12). Runs only under the `seed` profile, after the
  # app is healthy. Imports through People gRPC + Catalogue GraphQL + artwork HTTP.
  demo-importer:
    profiles: ["seed"]
    build:
      context: ./demo/importer
      dockerfile: Dockerfile
    environment:
      TMDB_READ_TOKEN: ${TMDB_READ_TOKEN:-}
      TMDB_IMAGE_BASE_URL: ${TMDB_IMAGE_BASE_URL:-https://image.tmdb.org/t/p/}
      TMDB_POSTER_SIZE: ${TMDB_POSTER_SIZE:-w500}
      TMDB_PROFILE_SIZE: ${TMDB_PROFILE_SIZE:-w185}
      CATALOGUE_GRAPHQL_URL: http://catalogue-service:8080/graphql
      CATALOGUE_HTTP_URL: http://catalogue-service:8080
      PEOPLE_HTTP_URL: http://people-service:8081
      PEOPLE_GRPC_TARGET: people-service:9090
      TMDB_MANIFEST_PATH: /app/manifest/tmdb-movie-ids.txt
    volumes:
      # mount the committed manifest read-only
      - ./demo/tmdb-movie-ids.txt:/app/manifest/tmdb-movie-ids.txt:ro
    depends_on:
      catalogue-service:
        condition: service_healthy
      people-service:
        condition: service_healthy
    restart: "no"
    networks: [internal]

volumes:
  catalogue-db-data:
  people-db-data:
  catalogue-artwork-data:
  person-artwork-data:

networks:
  internal:
    driver: bridge

services:
  minio:
    image: quay.io/minio/minio:RELEASE.2023-09-04T19-57-37Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      # Local/dev convenience only: direct mc/aws-cli access and the admin console.
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    networks: [internal]

  # One-shot administrative bootstrap (ADR-14): idempotently creates the per-service
  # buckets, identities, and least-privilege policies. Root credentials never reach
  # catalogue-service/people-service - only this container and `minio` itself see them.
  minio-init:
    image: quay.io/minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      CATALOGUE_MINIO_ACCESS_KEY: ${CATALOGUE_MINIO_ACCESS_KEY:-change-me-catalogue-key}
      CATALOGUE_MINIO_SECRET_KEY: ${CATALOGUE_MINIO_SECRET_KEY:-change-me-catalogue-secret}
      PEOPLE_MINIO_ACCESS_KEY: ${PEOPLE_MINIO_ACCESS_KEY:-change-me-people-key}
      PEOPLE_MINIO_SECRET_KEY: ${PEOPLE_MINIO_SECRET_KEY:-change-me-people-secret}
    entrypoint: ["/bin/sh", "/init/provision-minio.sh"]
    volumes:
      - ./scripts/minio-provision.sh:/init/provision-minio.sh:ro
    restart: "no"
    networks: [internal]

  catalogue-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${CATALOGUE_DB_NAME:-catalogue}
      POSTGRES_USER: ${CATALOGUE_DB_USER:-catalogue}
      POSTGRES_PASSWORD: ${CATALOGUE_DB_PASSWORD:-catalogue}
      # Pin the encoding emoji storage in comment fields relies on (V2.2-06),
      # rather than inheriting whatever the image's initdb default happens to
      # be. Only takes effect on first init of a fresh data volume.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
    volumes:
      - catalogue-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CATALOGUE_DB_USER:-catalogue} -d ${CATALOGUE_DB_NAME:-catalogue}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [internal]

  people-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${PEOPLE_DB_NAME:-people}
      POSTGRES_USER: ${PEOPLE_DB_USER:-people}
      POSTGRES_PASSWORD: ${PEOPLE_DB_PASSWORD:-people}
      # Pin the encoding emoji storage in comment fields relies on (V2.2-06),
      # rather than inheriting whatever the image's initdb default happens to
      # be. Only takes effect on first init of a fresh data volume.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
    volumes:
      - people-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PEOPLE_DB_USER:-people} -d ${PEOPLE_DB_NAME:-people}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [internal]

  people-service:
    build:
      context: ./backend
      dockerfile: people-service/Dockerfile
    environment:
      PEOPLE_DB_URL: jdbc:postgresql://people-db:5432/${PEOPLE_DB_NAME:-people}
      PEOPLE_DB_USER: ${PEOPLE_DB_USER:-people}
      PEOPLE_DB_PASSWORD: ${PEOPLE_DB_PASSWORD:-people}
      PEOPLE_GRPC_PORT: "9090"
      PEOPLE_HTTP_PORT: "8081"
      ARTWORK_STORAGE_TYPE: minio
      MINIO_ENDPOINT: http://minio:9000
      MINIO_REGION: ${MINIO_REGION:-us-east-1}
      PEOPLE_MINIO_ACCESS_KEY: ${PEOPLE_MINIO_ACCESS_KEY:-change-me-people-key}
      PEOPLE_MINIO_SECRET_KEY: ${PEOPLE_MINIO_SECRET_KEY:-change-me-people-secret}
    depends_on:
      people-db:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health/readiness | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    # gRPC (9090) and health (8081) stay on the internal network only.
    networks: [internal]

  catalogue-service:
    build:
      context: ./backend
      dockerfile: catalogue-service/Dockerfile
    environment:
      CATALOGUE_DB_URL: jdbc:postgresql://catalogue-db:5432/${CATALOGUE_DB_NAME:-catalogue}
      CATALOGUE_DB_USER: ${CATALOGUE_DB_USER:-catalogue}
      CATALOGUE_DB_PASSWORD: ${CATALOGUE_DB_PASSWORD:-catalogue}
      PEOPLE_GRPC_TARGET: static://people-service:9090
      CATALOGUE_HTTP_PORT: "8080"
      ARTWORK_STORAGE_TYPE: minio
      MINIO_ENDPOINT: http://minio:9000
      MINIO_REGION: ${MINIO_REGION:-us-east-1}
      CATALOGUE_MINIO_ACCESS_KEY: ${CATALOGUE_MINIO_ACCESS_KEY:-change-me-catalogue-key}
      CATALOGUE_MINIO_SECRET_KEY: ${CATALOGUE_MINIO_SECRET_KEY:-change-me-catalogue-secret}
    depends_on:
      catalogue-db:
        condition: service_healthy
      people-service:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health/readiness | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    ports:
      # Only the reviewer-facing Catalogue HTTP port is published.
      - "${CATALOGUE_HTTP_PORT:-8080}:8080"
    networks: [internal]

  # SvelteKit server-side BFF. Sits behind `proxy` now - not published to the
  # host directly, so ADDRESS_HEADER/PROTOCOL_HEADER tell adapter-node to trust
  # the proxy's X-Forwarded-* headers for client IP/protocol instead of seeing
  # the proxy's own connection. Calls Catalogue GraphQL + People HTTP
  # server-side over the internal network; the browser never touches the
  # backends directly.
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      CATALOGUE_GRAPHQL_URL: http://catalogue-service:8080/graphql
      CATALOGUE_HTTP_URL: http://catalogue-service:8080
      PEOPLE_HTTP_URL: http://people-service:8081
      ORIGIN: http://localhost:${FRONTEND_PORT:-4173}
      PORT: "3000"
      ADDRESS_HEADER: X-Forwarded-For
      PROTOCOL_HEADER: X-Forwarded-Proto
    depends_on:
      catalogue-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/movies || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks: [internal]

  # Edge reverse proxy (the browser's only entry point now). Compresses every
  # response - including the SSR'd HTML document, which adapter-node's own
  # server does not. Plain HTTP for now (matches the previous setup); real
  # HTTP/2 to the browser needs TLS in front, which this doesn't add.
  proxy:
    image: caddy:2.8-alpine
    volumes:
      - ./proxy/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      frontend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-4173}:80"
    networks: [internal]
    healthcheck:
      # V2.6-08: without this, `docker compose up --wait` only waits for the
      # container to reach "running", not for Caddy to actually be serving -
      # `wget --spider` is used (not curl) because the stock caddy:2.8-alpine
      # image has no curl.
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:80/"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot TMDB importer (§12). Runs only under the `seed` profile, after the
  # app is healthy. Imports through People gRPC + Catalogue GraphQL + artwork HTTP.
  demo-importer:
    profiles: ["seed"]
    build:
      context: ./demo/importer
      dockerfile: Dockerfile
    environment:
      TMDB_READ_TOKEN: ${TMDB_READ_TOKEN:-}
      TMDB_IMAGE_BASE_URL: ${TMDB_IMAGE_BASE_URL:-https://image.tmdb.org/t/p/}
      TMDB_POSTER_SIZE: ${TMDB_POSTER_SIZE:-w500}
      TMDB_PROFILE_SIZE: ${TMDB_PROFILE_SIZE:-w185}
      CATALOGUE_GRAPHQL_URL: http://catalogue-service:8080/graphql
      CATALOGUE_HTTP_URL: http://catalogue-service:8080
      PEOPLE_HTTP_URL: http://people-service:8081
      PEOPLE_GRPC_TARGET: people-service:9090
      TMDB_MANIFEST_PATH: /app/manifest/tmdb-movie-ids.txt
    volumes:
      # mount the committed manifest read-only
      - ./demo/tmdb-movie-ids.txt:/app/manifest/tmdb-movie-ids.txt:ro
    depends_on:
      catalogue-service:
        condition: service_healthy
      people-service:
        condition: service_healthy
    restart: "no"
    networks: [internal]

  # Concurrency/stress load test (V2-16). Runs only under the `loadtest`
  # profile, after the app is healthy. Spins up many concurrent workers doing
  # create/update/delete/upload on shared "hot" movie and person rows (forcing
  # collisions), plus a concurrent comment storm on one movie. Never touches
  # the curated demo catalogue - all records it creates are prefixed
  # "[LOADTEST]" and removed again (best-effort) at the end of the run.
  load-test:
    profiles: ["loadtest"]
    build:
      context: ./demo/loadtest
      dockerfile: Dockerfile
    environment:
      CATALOGUE_GRAPHQL_URL: http://catalogue-service:8080/graphql
      CATALOGUE_HTTP_URL: http://catalogue-service:8080
      PEOPLE_HTTP_URL: http://people-service:8081
      LOAD_DURATION_SECONDS: ${LOAD_DURATION_SECONDS:-30}
      LOAD_MOVIE_WORKERS: ${LOAD_MOVIE_WORKERS:-20}
      LOAD_PEOPLE_WORKERS: ${LOAD_PEOPLE_WORKERS:-10}
      LOAD_COMMENT_WORKERS: ${LOAD_COMMENT_WORKERS:-20}
      LOAD_HOT_MOVIES: ${LOAD_HOT_MOVIES:-6}
      LOAD_HOT_PEOPLE: ${LOAD_HOT_PEOPLE:-6}
    depends_on:
      catalogue-service:
        condition: service_healthy
      people-service:
        condition: service_healthy
    restart: "no"
    networks: [internal]

volumes:
  catalogue-db-data:
  people-db-data:
  minio-data:

networks:
  internal:
    driver: bridge

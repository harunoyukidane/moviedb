spring:
  application:
    name: catalogue-service
  datasource:
    url: ${CATALOGUE_DB_URL:jdbc:postgresql://localhost:5432/catalogue}
    username: ${CATALOGUE_DB_USER:catalogue}
    password: ${CATALOGUE_DB_PASSWORD:catalogue}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  graphql:
    schema:
      printer:
        enabled: true

management:
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        # gRPC-connectivity readiness contributor is added in phase 3.
        readiness:
          include: readinessState, db
  endpoints:
    web:
      exposure:
        include: health, info

# People gRPC client target (internal compose network).
grpc:
  client:
    people-service:
      address: ${PEOPLE_GRPC_TARGET:static://localhost:9090}
      negotiation-type: plaintext

server:
  port: ${CATALOGUE_HTTP_PORT:8080}

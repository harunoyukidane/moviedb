spring:
  application:
    name: catalogue-service
  datasource:
    url: ${CATALOGUE_DB_URL:jdbc:postgresql://localhost:5432/catalogue}
    username: ${CATALOGUE_DB_USER:catalogue}
    password: ${CATALOGUE_DB_PASSWORD:catalogue}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  graphql:
    schema:
      printer:
        enabled: true
  servlet:
    multipart:
      # Fast reject before buffering; the validator also enforces 5 MiB.
      max-file-size: 5MB
      max-request-size: 6MB

# Artwork bytes live on a mounted volume outside Git (§10, §14) when storage.type=local.
artwork:
  storage-path: ${ARTWORK_STORAGE_PATH:./data/artwork}
  # Storage backend selection (V2-02). MinIO properties are required only when
  # type=minio; left unset here means startup fails clearly if type=minio is
  # selected without them (see MediaConfig).
  storage:
    type: ${ARTWORK_STORAGE_TYPE:local}
    minio:
      endpoint: ${MINIO_ENDPOINT:}
      access-key: ${CATALOGUE_MINIO_ACCESS_KEY:}
      secret-key: ${CATALOGUE_MINIO_SECRET_KEY:}
      bucket: ${ARTWORK_MINIO_BUCKET:catalogue-artwork}
      region: ${MINIO_REGION:us-east-1}

management:
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        # readiness includes DB, People gRPC connectivity (§15), and object storage. The
        # "objectStorage" bean is registered under both storage.type=minio (real MinIO probe)
        # and type=local (always-UP stub) - see MediaConfig - because Spring Boot validates
        # readiness-group membership eagerly and would otherwise fail startup for local mode.
        readiness:
          include: readinessState, db, peopleGrpc, objectStorage
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  metrics:
    tags:
      service: catalogue-service

# Structured JSON logs (§15). Spring Boot native structured logging (ECS) emits
# one JSON object per line including MDC (correlationId). No secrets/PII are logged.
logging:
  structured:
    format:
      console: ecs
  level:
    root: INFO

# People gRPC client target (internal compose network).
grpc:
  client:
    people-service:
      address: ${PEOPLE_GRPC_TARGET:static://localhost:9090}
      negotiation-type: plaintext

server:
  port: ${CATALOGUE_HTTP_PORT:8080}

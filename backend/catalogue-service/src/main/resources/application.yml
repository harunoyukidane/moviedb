spring:
  application:
    name: catalogue-service
  datasource:
    url: ${CATALOGUE_DB_URL:jdbc:postgresql://localhost:5432/catalogue}
    username: ${CATALOGUE_DB_USER:catalogue}
    password: ${CATALOGUE_DB_PASSWORD:catalogue}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  graphql:
    schema:
      printer:
        enabled: true
  servlet:
    multipart:
      # Fast reject before buffering; the validator also enforces 5 MiB.
      max-file-size: 5MB
      max-request-size: 6MB

# Artwork bytes live on a mounted volume outside Git (§10, §14).
artwork:
  storage-path: ${ARTWORK_STORAGE_PATH:./data/artwork}

management:
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        # readiness includes DB and the People gRPC connectivity contributor (§15).
        readiness:
          include: readinessState, db, peopleGrpc
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  metrics:
    tags:
      service: catalogue-service

# Structured JSON logs (§15). Spring Boot native structured logging (ECS) emits
# one JSON object per line including MDC (correlationId). No secrets/PII are logged.
logging:
  structured:
    format:
      console: ecs
  level:
    root: INFO

# People gRPC client target (internal compose network).
grpc:
  client:
    people-service:
      address: ${PEOPLE_GRPC_TARGET:static://localhost:9090}
      negotiation-type: plaintext

server:
  port: ${CATALOGUE_HTTP_PORT:8080}

spring:
  application:
    name: people-service
  datasource:
    url: ${PEOPLE_DB_URL:jdbc:postgresql://localhost:5433/people}
    username: ${PEOPLE_DB_USER:people}
    password: ${PEOPLE_DB_PASSWORD:people}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

# Person photos live on a mounted volume outside Git (ADR-12 hybrid, §14).
artwork:
  storage-path: ${PERSON_ARTWORK_STORAGE_PATH:./data/person-artwork}

management:
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState, db
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  metrics:
    tags:
      service: people-service

# Structured JSON logs (§15) including MDC (correlationId). No secrets/PII logged.
logging:
  structured:
    format:
      console: ecs
  level:
    root: INFO

# gRPC server (internal network only; not published to host in compose).
grpc:
  server:
    port: ${PEOPLE_GRPC_PORT:9090}

server:
  port: ${PEOPLE_HTTP_PORT:8081}

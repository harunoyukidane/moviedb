spring:
  application:
    name: people-service
  datasource:
    url: ${PEOPLE_DB_URL:jdbc:postgresql://localhost:5433/people}
    username: ${PEOPLE_DB_USER:people}
    password: ${PEOPLE_DB_PASSWORD:people}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState, db
  endpoints:
    web:
      exposure:
        include: health, info

# gRPC server (internal network only; not published to host in compose).
grpc:
  server:
    port: ${PEOPLE_GRPC_PORT:9090}

server:
  port: ${PEOPLE_HTTP_PORT:8081}
